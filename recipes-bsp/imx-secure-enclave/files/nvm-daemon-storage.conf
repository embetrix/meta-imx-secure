[Unit]
RequiresMountsFor=@localstatedir@/secdata

[Service]
ExecStartPre=@base_bindir@/mkdir -p -m 0700 @localstatedir@/secdata/ele
ExecStartPre=@base_bindir@/chmod 0700 @localstatedir@/secdata/ele
ExecStartPre=@base_bindir@/chown root:root @localstatedir@/secdata/ele
