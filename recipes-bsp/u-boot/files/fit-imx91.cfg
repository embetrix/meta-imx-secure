# SPDX-License-Identifier: MIT
# Keep the FIT away from the kernel decompression address
CONFIG_SYS_LOAD_ADDR=0x98000000
CONFIG_USE_BOOTCOMMAND=y
# The i.MX91 BSP mmcboot command only handles booti
CONFIG_BOOTCOMMAND="setenv sec_boot no; setenv boot_fit yes; setenv verify yes; setenv image fitImage; if mmc dev ${mmcdev} && mmc rescan && run loadimage; then run mmcargs; bootm ${loadaddr}; fi"
