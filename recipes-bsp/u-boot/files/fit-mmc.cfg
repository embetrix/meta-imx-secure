CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if mmc dev ${mmcdev} && mmc rescan && load mmc ${mmcdev}:${mmcpart} ${cntr_addr} fitImage; then run mmcargs && bootm ${cntr_addr}; fi"
CONFIG_DEVICE_TREE_INCLUDES="fit-boot.dtsi"
CONFIG_CMD_MMC=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_FS_FAT=y
# CONFIG_BOOTSTD is not set
# CONFIG_CMD_SYSBOOT is not set
