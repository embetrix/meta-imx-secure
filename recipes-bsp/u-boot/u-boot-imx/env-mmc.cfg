# Match libubootenv/fw_env.config
# Disabled in prod by security-harden.cfg
# Production loading requires a whitelist via CONFIG_ENV_WRITEABLE_LIST
# https://docs.u-boot.org/en/latest/develop/environment.html#flags-for-environment-variables
CONFIG_ENV_IS_IN_MMC=y
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x1800
CONFIG_ENV_OFFSET=0x5000
CONFIG_ENV_OFFSET_REDUND=0x6800
CONFIG_ENV_MMC_EMMC_HW_PARTITION=0
# CONFIG_ENV_MMC_USE_DT is not set
# CONFIG_ENV_MMC_USE_SW_PARTITION is not set
# CONFIG_ENV_OFFSET_RELATIVE_END is not set
# CONFIG_ENV_OFFSET_REDUND_RELATIVE_END is not set
