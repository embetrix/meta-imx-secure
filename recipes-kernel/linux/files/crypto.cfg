# Enable common crypto algorithms
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_CBC=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_HMAC=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y
CONFIG_CRYPTO_ECDSA=y
CONFIG_CRYPTO_RSA=y
# ARM64 AES acceleration, SHA256 acceleration is selected automatically
CONFIG_CRYPTO_AES_ARM64=y
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y
# Asymmetric key parser
CONFIG_ASYMMETRIC_KEY_TYPE=y
CONFIG_ASYMMETRIC_PUBLIC_KEY_SUBTYPE=y
CONFIG_X509_CERTIFICATE_PARSER=y
CONFIG_PKCS7_MESSAGE_PARSER=y
# Use OP-TEE as the only trusted key backend
CONFIG_TEE=y
CONFIG_OPTEE=y
CONFIG_TRUSTED_KEYS=y
CONFIG_TRUSTED_KEYS_TEE=y
# CONFIG_TRUSTED_KEYS_TPM is not set
# CONFIG_TRUSTED_KEYS_CAAM is not set
# CONFIG_TRUSTED_KEYS_DCP is not set
CONFIG_ENCRYPTED_KEYS=y
