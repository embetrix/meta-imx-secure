# Security hardening baseline
# EXPERT exposes options needed to disable core dumps and io_uring
# It selects DEBUG_KERNEL, individual debug features stay disabled below
CONFIG_EXPERT=y
CONFIG_DEBUG_KERNEL=y
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_STRICT_MODULE_RWX=y
CONFIG_RANDOMIZE_BASE=y
CONFIG_SYN_COOKIES=y
CONFIG_DEFAULT_MMAP_MIN_ADDR=65536
CONFIG_PROC_MEM_FORCE_PTRACE=y
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y

# Memory hardening
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_INIT_ON_FREE_DEFAULT_ON=y
CONFIG_INIT_STACK_ALL_ZERO=y
CONFIG_VMAP_STACK=y
CONFIG_RANDOMIZE_KSTACK_OFFSET=y
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_BUCKETS=y
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
CONFIG_RANDOM_KMALLOC_CACHES=y
CONFIG_LIST_HARDENED=y
CONFIG_ZERO_CALL_USED_REGS=y

# ARM64-specific protections
CONFIG_ARM64_PAN=y
CONFIG_ARM64_SW_TTBR0_PAN=y
CONFIG_UNMAP_KERNEL_AT_EL0=y
CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY=y

# CFI needs a compiler with -fsanitize=kcfi support
CONFIG_CFI=y
CONFIG_SHADOW_CALL_STACK=y

# Kernel lockdown
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y

# LSM access control
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# BPF hardening
CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
CONFIG_BPF_JIT_ALWAYS_ON=y

# Panic on faults
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=-1
CONFIG_BUG_ON_DATA_CORRUPTION=y
CONFIG_SCHED_STACK_END_CHECK=y

# Disable dangerous features
CONFIG_STAGING=n
CONFIG_COMPAT_BRK=n
CONFIG_USERFAULTFD=n
CONFIG_LEGACY_PTYS=n
CONFIG_HIBERNATION=n
CONFIG_BINFMT_MISC=n
CONFIG_LEGACY_TIOCSTI=n
CONFIG_LDISC_AUTOLOAD=n
CONFIG_IO_URING=n
CONFIG_IOMMU_DEFAULT_DMA_STRICT=y

# Networking hardening
CONFIG_IP_MULTICAST=n
CONFIG_NETFILTER=y

# Disable debug features
CONFIG_KALLSYMS=n
CONFIG_KALLSYMS_ALL=n
CONFIG_DEBUG_MISC=n
CONFIG_DEBUG_INFO_NONE=y
CONFIG_DEBUG_FS=n
CONFIG_MAGIC_SYSRQ=n
CONFIG_PROC_KCORE=n
CONFIG_FTRACE=n
CONFIG_FUNCTION_TRACER=n
CONFIG_DYNAMIC_FTRACE=n
CONFIG_STACKTRACE=n
CONFIG_RUNTIME_TESTING_MENU=n
CONFIG_KPROBES=n
CONFIG_KGDB=n
CONFIG_PROFILING=n
CONFIG_COREDUMP=n
CONFIG_DEVMEM=n
CONFIG_DEVPORT=n
CONFIG_ALLOW_DEV_COREDUMP=n
CONFIG_CHECKPOINT_RESTORE=n
CONFIG_CROSS_MEMORY_ATTACH=n
CONFIG_SLUB_DEBUG=n
CONFIG_IKCONFIG=n

# Disable EFI
CONFIG_EFI_STUB=n
CONFIG_EFI=n
CONFIG_EFI_PARTITION=y

# Filesystems: disable not needed
CONFIG_F2FS_FS=n
CONFIG_BTRFS_FS=n
CONFIG_XFS_FS=n
CONFIG_JFS_FS=n
CONFIG_GFS2_FS=n
CONFIG_NILFS2_FS=n
CONFIG_ECRYPT_FS=n
CONFIG_HFS_FS=n
CONFIG_HFSPLUS_FS=n
CONFIG_NTFS_FS=n
CONFIG_NTFS3_FS=n
CONFIG_EXFAT_FS=n
CONFIG_ISO9660_FS=n
CONFIG_UDF_FS=n
CONFIG_FUSE_FS=n
CONFIG_JFFS2_FS=n
CONFIG_NETWORK_FILESYSTEMS=n
CONFIG_OVERLAY_FS=n

# Disable kexec
CONFIG_KEXEC=n
CONFIG_KEXEC_FILE=n
CONFIG_KEXEC_CORE=n

# Disable virtualization/KVM
CONFIG_VIRTUALIZATION=n
CONFIG_KVM=n

# Disable 32-bit compat (native aarch64 only)
CONFIG_COMPAT=n
CONFIG_ARMV8_DEPRECATED=n

# Selinux
CONFIG_SECURITY_SELINUX_DEVELOP=n
