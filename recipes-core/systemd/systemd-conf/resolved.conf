[Resolve]
# Use Cloudflare for the default DNS route with no fallback servers
DNS=1.1.1.1
FallbackDNS=
Domains=~.

# Require DNSSEC validation without DNS-over-TLS encryption
DNSSEC=yes
DNSOverTLS=no

# Disable caching and local multicast name resolution
Cache=no
LLMNR=no
MulticastDNS=no

# Serve local DNS requests through the stub resolver
DNSStubListener=yes
