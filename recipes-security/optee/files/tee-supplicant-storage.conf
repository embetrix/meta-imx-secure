[Unit]
Requires=var-secdata.mount
After=var-secdata.mount

[Service]
ExecStartPre=!@base_bindir@/mkdir -p -m 0700 @localstatedir@/secdata/tee
ExecStartPre=!@base_bindir@/chmod 0700 @localstatedir@/secdata/tee
ExecStartPre=!@base_bindir@/chown teesuppl:teesuppl @localstatedir@/secdata/tee
ExecStart=
ExecStart=@sbindir@/tee-supplicant $OPTARGS --fs-parent-path=@localstatedir@/secdata/tee /dev/%I
