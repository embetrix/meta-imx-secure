[Unit]
Requires=var-blobs.mount
After=var-blobs.mount

[Service]
ExecStartPre=!@base_bindir@/mkdir -p -m 0700 @localstatedir@/blobs/tee
ExecStartPre=!@base_bindir@/chmod 0700 @localstatedir@/blobs/tee
ExecStartPre=!@base_bindir@/chown teesuppl:teesuppl @localstatedir@/blobs/tee
ExecStart=
ExecStart=@sbindir@/tee-supplicant $OPTARGS --fs-parent-path=@localstatedir@/blobs/tee /dev/%I
