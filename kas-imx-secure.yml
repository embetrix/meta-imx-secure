header:
  version: 14

machine: imx95-15x15-lpddr4x-frdm
distro: imx-secure
target:
  - imx-secure-image-base
  - imx-secure-image-base-update

repos:
  meta-imx-secure:
    path: .

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake.git
    # Wrynose uses BitBake 2.18
    branch: "2.18"
    path: layers/bitbake
    layers:
      .: disabled

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    branch: wrynose
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: wrynose
    commit: 0979b80429099f1a42dc0026c8c466cee780bc74
    path: layers/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-freescale:
    url: https://github.com/Freescale/meta-freescale.git
    branch: wrynose
    commit: e85acf26e68770c4f0211cbc7af17bed15ef2a27
    path: layers/meta-freescale

  meta-avb:
    url: "https://github.com/embetrix/meta-avb.git"
    branch: wrynose
    path: "layers/meta-avb"

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    branch: wrynose
    path: "layers/meta-security"
    layers:
      .:
      meta-integrity:
      meta-tpm:

  meta-selinux:
    url: https://git.yoctoproject.org/git/meta-selinux.git
    branch: wrynose
    path: layers/meta-selinux

  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate.git
    branch: wrynose
    path: layers/meta-swupdate

  meta-trowl:
    url: https://github.com/corefense-security/meta-trowl.git
    branch: main
    path: layers/meta-trowl

env:
  SECURITY_PROFILE: "dev"

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
  license: |
    ACCEPT_FSL_EULA = "1"
  security: |
    IMX_SECURITY_PROFILE = "${SECURITY_PROFILE}"
