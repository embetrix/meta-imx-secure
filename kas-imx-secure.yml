# SPDX-License-Identifier: MIT
# BSP layers pinned to NXP LF6.18.37_2.1.0 other repos follow Wrynose
# https://github.com/nxp-imx/imx-manifest/blob/5e07321d7a0d9e4f46504d078625e403906b63e9/imx-6.18.37-2.1.0.xml
header:
  version: 14

machine: imx95-15x15-lpddr4x-frdm
distro: imx-secure
target: imx-secure-image

repos:
  meta-imx-secure:
    path: .

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake.git
    # Wrynose uses BitBake 2.18
    branch: "2.18"
    path: layers/bitbake
    layers:
      .: disabled

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    branch: wrynose
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-perl:
      meta-networking:
      meta-multimedia:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: wrynose
    commit: 0979b80429099f1a42dc0026c8c466cee780bc74
    path: layers/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-yocto:
    # Required by meta-imx-sdk through meta-freescale-distro
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    path: layers/meta-yocto
    layers:
      meta-poky:

  meta-freescale:
    url: https://github.com/Freescale/meta-freescale.git
    branch: wrynose
    commit: ca31f33c5b5e433939c5f8442d2de56925d638bd
    path: layers/meta-freescale

  meta-freescale-distro:
    url: https://github.com/Freescale/meta-freescale-distro.git
    branch: wrynose
    commit: 4464f38b4aa618b5942f5e35dd25cff590f410a6
    path: layers/meta-freescale-distro

  meta-imx:
    url: https://github.com/nxp-imx/meta-imx.git
    branch: wrynose-6.18.37-2.1.0
    commit: 840f8da0f3350bf389067f84922c7436efde0653
    path: layers/meta-imx
    layers:
      meta-imx-bsp:
      meta-imx-sdk:

env:
  # Set to 1 to accept NXP's EULA
  ACCEPT_FSL_EULA: "1"

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
    ACCEPT_FSL_EULA = "1"
  debug: |
    EXTRA_IMAGE_FEATURES:append = " allow-empty-password allow-root-login empty-root-password"
  signing: |
    IMX_SIGN_ENABLE = "1"
    IMX_SIGN_DEBUG  = "1"
