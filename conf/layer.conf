BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "imx-secure"
BBFILE_PATTERN_imx-secure = "^${LAYERDIR}/"
BBFILE_PRIORITY_imx-secure = "9"

LAYERDEPENDS_imx-secure = " \
    core \
    openembedded-layer \
    meta-python \
    perl-layer \
    networking-layer \
    multimedia-layer \
    meta-arm \
    arm-toolchain \
    freescale-layer \
    fsl-bsp-release \
    avb \
    security \
    integrity \
"
LAYERSERIES_COMPAT_imx-secure = "wrynose"
