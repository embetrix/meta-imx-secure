BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILES_DYNAMIC += " \
    tpm-layer:${LAYERDIR}/dynamic-layers/tpm/recipes-*/*/*.bbappend \
    swupdate:${LAYERDIR}/dynamic-layers/swupdate/recipes-*/*/*.bb \
    swupdate:${LAYERDIR}/dynamic-layers/swupdate/recipes-*/*/*.bbappend \
    selinux:${LAYERDIR}/dynamic-layers/selinux/recipes-*/*/*.bb \
    selinux:${LAYERDIR}/dynamic-layers/selinux/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "imx-secure"
BBFILE_PATTERN_imx-secure = "^${LAYERDIR}/"
BBFILE_PRIORITY_imx-secure = "9"

# Keep the layer path for Git version lookup and optional integrations
IMX_SECURE_BASE := "${LAYERDIR}"

LAYERDEPENDS_imx-secure = " \
    core \
    openembedded-layer \
    meta-python \
    networking-layer \
    multimedia-layer \
    meta-arm \
    arm-toolchain \
    freescale-layer \
    avb \
    security \
    integrity \
"
LAYERSERIES_COMPAT_imx-secure = "wrynose"
